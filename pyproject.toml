[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-pool"
version = "3.4.0"
description = "免费代理 IP 池：异步采集、校验、Redis 存储与 HTTP API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
    "aiohttp-socks>=0.9",
    "redis>=5.0",
    "flask>=3.0",
    "apscheduler>=3.10",
    "click>=8.1",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "fakeredis>=2.20",
]
server = ["gunicorn>=22.0"]

[project.scripts]
proxypool = "proxyPool:cli"

[tool.setuptools]
py-modules = ["config", "logging_setup", "models", "proxyPool", "scheduler", "service", "setting"]
packages = ["api", "checker", "fetcher", "fetcher.sources", "storage", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: 需要外部服务（如 Redis）的集成测试",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "docs/*",
    "setup.py",
    ".venv/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
